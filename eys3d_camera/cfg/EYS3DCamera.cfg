#!/usr/bin/env python
# -*- coding: utf-8 -*-
# Runtime-tunable controls, exposed over dynamic_reconfigure.
#
# Every control here is applied to the live stream, so it can be retuned
# from rqt_reconfigure without reopening the device. The ranges are the ones
# the node validates against, so a value the node would reject is not
# offerable here.
#
# Launch-time-only settings (model, mode_id, resolution, spatial filter,
# hole filling, frame ids, ...) are deliberately absent: they are read once
# at open() and changing them would require reopening the device.

PACKAGE = "eys3d_camera"

from dynamic_reconfigure.parameter_generator_catkin import *

# Level is 0 throughout: the callback diffs against a cached copy rather than
# reading the level, which also stays correct across updateConfig().
gen = ParameterGenerator()

# ---- Image controls -------------------------------------------------
# IR projector level. -1 keeps the per-model default (G100+/R77 = 3,
# G62 = 60); 0 turns the projector off. The upper bound is the widest
# firmware range across the supported models (G62 = 0..96); the device
# clamps to the value its own firmware reports.
gen.add("ir_value", int_t, 0,
        "IR projector level. -1 = per-model default, 0 = off.",
        -1, -1, 96)

gen.add("auto_exposure", bool_t, 0,
        "Firmware auto-exposure.", True)

gen.add("exposure_time_step", int_t, 0,
        "Signed log2 exposure register. Applies only while auto_exposure is off.",
        0, -13, 3)

gen.add("auto_white_balance", bool_t, 0,
        "Firmware auto white balance. Rejected on monochrome modules.", True)

power_line_enum = gen.enum(
    [gen.const("PowerLine_50Hz", int_t, 1, "50 Hz mains"),
     gen.const("PowerLine_60Hz", int_t, 2, "60 Hz mains")],
    "Mains frequency used for flicker cancellation")
gen.add("power_line_frequency", int_t, 0,
        "Mains frequency for flicker cancellation.",
        2, 1, 2, edit_method=power_line_enum)

# ---- Temporal filter ------------------------------------------------
# The only post-processing filter that is runtime-tunable; the spatial
# filter and hole filling are fixed at open().
gen.add("temporal_filter", bool_t, 0,
        "Enable the temporal (alpha-blend + persistence) depth filter.", False)

gen.add("temporal_filter_alpha", double_t, 0,
        "Blend weight of the current frame. Lower = smoother, more lag.",
        0.4, 0.0, 1.0)

gen.add("temporal_filter_delta", int_t, 0,
        "Max disparity change still treated as the same surface (raw units).",
        20, 1, 4095)

gen.add("temporal_filter_persistence", int_t, 0,
        "How many frames a missing pixel keeps its last value.",
        3, 0, 8)

# ---- Self-calibration -----------------------------------------------
gen.add("selfcal_profile", str_t, 0,
        "Tuning profile name (without .json) used by the next selfcal run.",
        "maintenance_dock")

exit(gen.generate(PACKAGE, "eys3d_camera", "EYS3DCamera"))
